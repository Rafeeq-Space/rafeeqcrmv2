<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مساعد المبيعات — بحث السيارات + حاسبة التمويل</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#006C35;--green-dark:#00522a;--green-light:#0a8c48;--gold:#C9A227;--gold-light:#e6c860;
    --ink:#0e1a14;--panel:#fff;--bg1:#04361f;--bg2:#0a1f16;--muted:#6b7d73;--line:#e3ece7;--danger:#b3261e;
    --radius:16px;--shadow:0 14px 40px rgba(0,0,0,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(1200px 600px at 90% -10%,rgba(201,162,39,.18),transparent 60%),
      radial-gradient(900px 500px at -10% 110%,rgba(10,140,72,.25),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));
    padding:20px 14px 60px;display:flex;flex-direction:column;align-items:center}
  .wrap{width:100%;max-width:1040px}
  .brand{display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:16px}
  .brand .logo{width:50px;height:50px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:14px;box-shadow:var(--shadow)}
  .brand h1{font-size:1.3rem;font-weight:800}
  .brand p{font-size:.82rem;opacity:.8;font-weight:500;margin-top:2px}
  .brand .flag{margin-inline-start:auto;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:700}
  .brand .flag svg{width:20px;height:20px}
  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .card-head{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:15px 20px;
    display:flex;align-items:center;gap:10px;position:relative}
  .card-head::after{content:"";position:absolute;inset-inline-start:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--gold),transparent)}
  .card-head svg{width:24px;height:24px}.card-head h2{font-size:1.08rem;font-weight:800}
  .card-body{padding:18px 20px}
  /* search */
  .searchbox{display:flex;gap:10px;flex-wrap:wrap}
  .searchbox input{flex:1;min-width:220px;padding:14px 16px;font-family:inherit;font-size:1.05rem;font-weight:600;
    border:2px solid var(--line);border-radius:12px;background:#fbfdfc}
  .searchbox input:focus{outline:none;border-color:var(--green-light);box-shadow:0 0 0 4px rgba(10,140,72,.12)}
  .btn{border:none;font-family:inherit;font-weight:800;font-size:1rem;padding:14px 24px;border-radius:12px;cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:linear-gradient(135deg,var(--green),var(--green-light));color:#fff;box-shadow:0 8px 20px rgba(10,140,72,.3)}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{cursor:pointer;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fbfdfc;
    font-size:.83rem;font-weight:700;color:#33443b;transition:.12s}
  .chip:hover{border-color:var(--green-light);color:var(--green)}
  .hint{color:var(--muted);font-size:.8rem;font-weight:500}
  .parsed{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}
  .tagpill{background:rgba(10,140,72,.1);border:1px solid rgba(10,140,72,.3);color:var(--green-dark);
    padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
  /* results */
  .count{margin:2px 2px 12px;color:#fff;font-weight:700;font-size:.9rem;opacity:.9}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .cars{width:100%;max-width:1040px}
  .vcard{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .vtop{padding:14px 16px;border-bottom:1px solid var(--line)}
  .vtop .vt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .vtop h3{font-size:1.05rem;font-weight:800}
  .vtop .yr{font-size:.75rem;font-weight:800;color:#8a6d10;background:rgba(201,162,39,.15);border:1px solid rgba(201,162,39,.4);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .vtop .sub{color:var(--muted);font-size:.83rem;font-weight:600;margin-top:2px}
  .vbadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .vb{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:6px;background:#f0f5f2;color:#33443b}
  .vb.j{background:rgba(10,140,72,.12);color:var(--green-dark)}
  .vb.nj{background:rgba(179,38,30,.08);color:var(--danger)}
  .vb.sr{background:rgba(201,162,39,.15);color:#8a6d10}
  .vmid{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  .vmid .price{font-size:1.35rem;font-weight:800;color:var(--green)}
  .vmid .price small{font-size:.8rem;color:var(--muted);font-weight:700}
  .vmid .branch{font-size:.82rem;font-weight:700;color:var(--muted);text-align:left}
  .why{padding:0 16px 12px;color:var(--muted);font-size:.82rem;font-weight:600;line-height:1.6}
  .vcalc{margin-top:auto;border-top:1px solid var(--line);padding:12px 16px;background:#fbfdfc}
  .vcalc .btn{width:100%;justify-content:center;padding:11px}
  .empty{text-align:center;color:#fff;opacity:.85;font-weight:600;padding:30px}
  /* modal calc */
  .modal{position:fixed;inset:0;background:rgba(4,20,12,.6);display:none;align-items:flex-start;justify-content:center;
    padding:24px 12px;overflow:auto;z-index:50}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:560px;overflow:hidden}
  .sheet-head{background:linear-gradient(135deg,#0e1a14,#1e2f26);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}
  .sheet-head h3{font-size:1.05rem;font-weight:800;flex:1}
  .sheet-head .x{cursor:pointer;font-size:1.4rem;line-height:1;opacity:.8}
  .sheet-body{padding:18px 20px}
  .field{margin-bottom:14px}
  .field>label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
  input[type=number],select{width:100%;padding:11px 14px;font-family:inherit;font-size:1rem;font-weight:700;
    border:2px solid var(--line);border-radius:10px;background:#fbfdfc;-moz-appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus,select:focus{outline:none;border-color:var(--green-light);box-shadow:0 0 0 3px rgba(10,140,72,.12)}
  select{appearance:none;cursor:pointer}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:inline-flex;gap:6px;flex-wrap:wrap}
  .seg label{cursor:pointer;padding:8px 13px;border-radius:9px;border:2px solid var(--line);background:#fbfdfc;font-weight:700;font-size:.82rem;position:relative}
  .seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .seg label:has(input:checked){border-color:var(--green);background:rgba(10,140,72,.1);color:var(--green)}
  .res{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .line{display:flex;justify-content:space-between;padding:6px 0;font-weight:600;font-size:.92rem}
  .line span:first-child{color:var(--muted)}.line span:last-child{font-weight:800}
  .line.tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-size:1.05rem}
  .note{margin-top:10px;background:rgba(10,140,72,.07);border:1px solid rgba(10,140,72,.2);border-radius:10px;padding:10px 12px;font-size:.83rem;font-weight:600;color:var(--green-dark);line-height:1.6}
  .note.warn{background:rgba(179,38,30,.06);border-color:rgba(179,38,30,.25);color:var(--danger)}
  .subhead{font-weight:800;margin:16px 0 8px;color:var(--green-dark);font-size:.95rem}
  footer{margin-top:20px;color:rgba(255,255,255,.6);font-size:.78rem;text-align:center}
</style>
</head>

const fmt = n => Math.round(n).toLocaleString('en-US');
const AR2EN = s => s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));

/* ===== search parsing (local, no AI) ===== */
const BRANDS={'كيا':'Kia','kia':'Kia','هيونداي':'Hyundai','hyundai':'Hyundai','نيسان':'Nissan','nissan':'Nissan',
 'جيتور':'Jetour','jetour':'Jetour','جاك':'GAC','gac':'GAC','سوزوكي':'Suzuki','suzuki':'Suzuki','هوندا':'Honda',
 'تويوتا':'Toyota','فورد':'Ford','ford':'Ford','شيفروليه':'Chevrolet','هافال':'Haval','جريت':'Great Wall','ام جي':'MG','mg':'MG'};
const BRANCHES=['الرياض','جدة','الدمام','الهزاع'];
const TAGWORDS={'شبابي':'شبابي','رياضي':'رياضي','رياضيه':'رياضي','عائلي':'عائلي','عائلية':'عائلي','عائله':'عائلي','فخم':'فخم','فخمة':'فخم',
 'اقتصادي':'اقتصادي','اقتصاديه':'اقتصادي','رخيص':'اقتصادي','دفع رباعي':'دفع رباعي','رباعي':'دفع رباعي','تجاري':'تجاري','عمل':'تجاري'};

function parse(q){
  q=' '+AR2EN(q.toLowerCase().replace(/[،,]/g,' '))+' ';
  const f={brand:null,branch:null,tags:[],sunroof:false,zeroDown:false,seats7:false,body:null,max:null,min:null,year:null};
  for(const k in BRANDS) if(q.includes(k)) f.brand=BRANDS[k];
  for(const b of BRANCHES) if(q.includes(b)) f.branch=b;
  for(const k in TAGWORDS) if(q.includes(k) && !f.tags.includes(TAGWORDS[k])) f.tags.push(TAGWORDS[k]);
  if(/فتحه|فتحة|سقف|صنروف/.test(q)) f.sunroof=true;
  if(/بدون دفعه|بدون دفعة|بلا دفعه|بدون مقدم|صفر دفعه|بدون اول/.test(q)) f.zeroDown=true;
  if(/سبع|٧ ركاب|7 ركاب|عائله كبيره|كبيره|سفر/.test(q)) f.seats7=true;
  if(/سيدان|صالون/.test(q)) f.body='سيدان';
  if(/جيب|دفع|suv|اس يو/.test(q)) f.body='SUV';
  // prices: "تحت X", "اقل من X", "من X الى Y", "ميزانيه X", or a lone big number
  let m;
  if(m=q.match(/(?:تحت|اقل من|حدود|ميزانيه|ميزانية|بحدود)\s*([\d]+)\s*(الف|000)?/)) f.max=num(m[1],m[2]);
  if(m=q.match(/من\s*([\d]+)\s*(الف|000)?\s*(?:الى|إلى|ل)\s*([\d]+)\s*(الف|000)?/)) {f.min=num(m[1],m[2]);f.max=num(m[3],m[4]);}
  if(m=q.match(/(20\d\d)/)) f.year=+m[1];
  if(f.max==null){ const big=q.match(/\b(\d{2,3})\s*الف\b/)||q.match(/\b(\d{5,6})\b/); if(big) f.max=num(big[1], big[0].includes('الف')?'الف':null); }
  return f;
}
function num(n,unit){ n=+n; if(unit) n*=1000; else if(n<1000) n*=1000; return n; }

function score(c,f){
  let s=0;
  if(f.brand){ if(c.brand!==f.brand) return -1; s+=3; }
  if(f.branch){ if(c.branch!==f.branch) return -1; s+=3; }
  if(f.max){ if(c.price>f.max*1.02) return -1; s+=2; }
  if(f.min){ if(c.price<f.min*0.98) return -1; }
  if(f.year){ if(c.year!==f.year) return -1; s+=1; }
  if(f.sunroof){ if(c.sunroof!==true) return -1; s+=2; }
  if(f.zeroDown){ if(!c.zero_down) return -1; s+=2; }
  if(f.seats7){ if((c.seats||5)<7) return -1; s+=2; }
  if(f.body){ const isSuv=(c.body||'').includes('SUV'); if(f.body==='SUV'&&!isSuv) return -1; if(f.body==='سيدان'&&!(c.body||'').includes('سيدان')) return -1; s+=1; }
  for(const t of f.tags){ if((c.tags||[]).includes(t)) s+=2; else return -1; }
  if(c.status!=='متاح') s-=0.5;
  return s;
}

function whyText(c,f){
  const bits=[];
  if(f.tags.length) bits.push(f.tags.join(' و'));
  if(f.sunroof&&c.sunroof) bits.push('فيها فتحة سقف');
  if(f.seats7&&c.seats>=7) bits.push(c.seats+' مقاعد للعائلة');
  if(f.zeroDown&&c.zero_down) bits.push('مجيّرة — تمويل ممكن بدون دفعة أولى (الراجحي محوّل)');
  if(f.branch) bits.push('متوفرة في '+c.branch);
  if(!bits.length) bits.push(c.body+' — '+(c.tags||[]).join('، '));
  return 'مناسبة لأن: '+bits.join(' • ')+'.';
}

let LAST=[];
function run(){
  const f=parse($('q').value||'');
  // parsed pills
  const pills=[];
  if(f.brand)pills.push(f.brand); if(f.branch)pills.push('فرع '+f.branch);
  f.tags.forEach(t=>pills.push(t)); if(f.sunroof)pills.push('فتحة سقف'); if(f.zeroDown)pills.push('بدون دفعة أولى');
  if(f.seats7)pills.push('٧ مقاعد'); if(f.body)pills.push(f.body);
  if(f.max)pills.push('حتى '+fmt(f.max)); if(f.min)pills.push('من '+fmt(f.min)); if(f.year)pills.push(f.year);
  $('parsed').innerHTML = pills.length? 'فُهم الطلب: '+pills.map(p=>`<span class="tagpill">${p}</span>`).join('') : '';

  let ranked = CARS.map(c=>({c,s:score(c,f)})).filter(x=>x.s>=0)
    .sort((a,b)=> b.s-a.s || (a.c.status==='متاح'?-1:1) || a.c.price-b.c.price);
  // dedupe by model+trim+price to show variety, keep top ~9
  LAST = ranked.slice(0,9).map(x=>x.c);
  render(LAST,f, ranked.length);
}
function render(list,f,total){
  $('count').textContent = list.length? `أفضل ${list.length} من ${total} سيارة مطابقة` : '';
  if(!list.length){ $('results').innerHTML=''; $('count').innerHTML='<div class="empty">ما فيه سيارة مطابقة تماماً — جرّب تقلل الشروط أو وسّع الميزانية.</div>'; return; }
  $('results').innerHTML = list.map((c,i)=>`
    <div class="vcard">
      <div class="vtop">
        <div class="vt"><h3>${c.brand_ar} ${c.model}</h3><span class="yr">${c.year||''}</span></div>
        <div class="sub">${c.trim||''} • ${c.body} • ${c.seats} مقاعد • ${c.color_ext||''}</div>
        <div class="vbadges">
          <span class="vb ${c.jeer==='مجير'?'j':'nj'}">${c.jeer}</span>
          ${c.sunroof===true?'<span class="vb sr">فتحة سقف</span>':''}
          ${(c.tags||[]).slice(0,2).map(t=>`<span class="vb">${t}</span>`).join('')}
          <span class="vb">${c.status}</span>
        </div>
      </div>
      <div class="vmid"><div class="price">${fmt(c.price)} <small>ريال</small></div><div class="branch">فرع<br>${c.branch}</div></div>
      <div class="why">${whyText(c,f)}</div>
      <div class="vcalc"><button class="btn btn-primary" onclick="openCalc(${i})">احسب الاستقطاع والقسط ←</button></div>
    </div>`).join('');
}

/* quick chips */
const CHIPS=['شبابي فتحة سقف','عائلي ٧ مقاعد','اقتصادي تحت 60 ألف','بدون دفعة أولى','جيتور','فخم دفع رباعي','متوفر في جدة'];
$('chips').innerHTML = CHIPS.map(c=>`<span class="chip" onclick="$('q').value='${c}';run()">${c}</span>`).join('');

/* ================= CALCULATORS ================= */
function ratioInfo(salary,type,hasP,hasR){
  if(salary>25000) return {r:0.70,why:'الراتب أكبر من ٢٥,٠٠٠ ← ٧٠٪'};
  if(type==='retiree'&&(hasP||hasR)) return {r:0.45,why:'متقاعد مع التزام ← ٤٥٪'};
  if(hasR) return salary<15000?{r:0.55,why:'عقاري (<١٥ألف) ٥٥٪'}:{r:0.65,why:'عقاري (≥١٥ألف) ٦٥٪'};
  if(hasP) return {r:0.45,why:'التزام شخصي ٤٥٪'};
  const b={bank:[0.33,'موظف بنك'],company:[0.45,'موظف شركة'],retiree:[0.25,'متقاعد']}[type];
  return {r:b[0],why:'بدون التزامات — '+b[1]};
}
let CURCAR=null, lastAvail=0;
function openCalc(i){
  CURCAR=LAST[i]; $('mTitle').textContent=`${CURCAR.brand_ar} ${CURCAR.model} — ${fmt(CURCAR.price)} ريال`;
  const isMujeer = CURCAR.jeer==='مجير';
  $('mBody').innerHTML = `
    <div class="note">🚗 ${CURCAR.brand_ar} ${CURCAR.model} ${CURCAR.trim||''} • ${CURCAR.year||''} • فرع ${CURCAR.branch} • السعر <b>${fmt(CURCAR.price)}</b> ريال • ${CURCAR.jeer}
    ${isMujeer?'— مجيّرة: يمكن تمويلها بدون دفعة أولى (الراجحي محوّل).':'— غير مجيّرة: قد يتطلب التمويل دفعة أولى.'}</div>

    <div class="subhead">١) الاستقطاع (قدرة العميل)</div>
    <div class="field"><label>الراتب الشهري</label><input type="number" id="c_sal" placeholder="مثال: 9000" oninput="calcAll()"></div>
    <div class="field"><label>نوع العميل (بدون التزامات)</label><div class="seg" id="c_type" onchange="calcAll()">
      <label><input type="radio" name="ct" value="bank" checked> بنك ٣٣٪</label>
      <label><input type="radio" name="ct" value="company"> شركة ٤٥٪</label>
      <label><input type="radio" name="ct" value="retiree"> متقاعد ٢٥٪</label></div></div>
    <div class="row2">
      <div class="field"><label>قسط شخصي قائم</label><input type="number" id="c_p" placeholder="0" oninput="calcAll()"></div>
      <div class="field"><label>قسط عقاري قائم</label><input type="number" id="c_r" placeholder="0" oninput="calcAll()"></div>
    </div>
    <div class="field"><label>حد الفيزا (٥٪ يُحسب التزام)</label><input type="number" id="c_v" placeholder="0" oninput="calcAll()"></div>
    <div id="dedOut"></div>

    <div class="subhead">٢) قسط البنك لهذي السيارة</div>
    <div class="row2">
      <div class="field"><label>البنك</label><select id="c_bank" onchange="calcAll()"><option value="rajhi">الراجحي</option><option value="ahli">الأهلي</option></select></div>
      <div class="field"><label>نوع العميل</label><select id="c_tr" onchange="calcAll()"><option value="yes">محوّل</option><option value="no">غير محوّل</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>جهة العمل</label><select id="c_emp" onchange="calcAll()"><option value="approved">معتمد</option><option value="nonapproved">غير معتمد</option><option value="gov">حكومي</option></select></div>
      <div class="field"><label>مدة التمويل</label><select id="c_mo" onchange="calcAll()"><option>12</option><option>24</option><option>36</option><option>48</option><option selected>60</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>العمر</label><input type="number" id="c_age" placeholder="34" value="34" oninput="ageIns();calcAll()"></div>
      <div class="field"><label>نسبة التأمين %</label><select id="c_ins" onchange="calcAll()">${[4,4.5,5,5.5,6,6.5,7,7.5,8,8.5].map(v=>`<option value="${v}"${v==4.5?' selected':''}>${v}٪</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>الدفعة الأولى % <span class="hint">(زِدها حتى يناسب الاستقطاع)</span></label><input type="number" id="c_dp" value="0" min="0" max="100" oninput="calcAll()"></div>
    <div id="bankOut"></div>`;
  $('modal').classList.add('on');
  calcAll();
}
function closeM(){ $('modal').classList.remove('on'); }
$('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeM(); });
function ageIns(){ const a=+$('c_age').value||0; if(a>0) $('c_ins').value = a<=25?'6.5':'4.5'; }

function calcAll(){
  if(!CURCAR) return;
  const sal=+$('c_sal').value||0, type=document.querySelector('input[name=ct]:checked').value;
  const p=+$('c_p').value||0, r=+$('c_r').value||0, vlim=+$('c_v').value||0, visa=vlim*0.05;
  const hasP=p>0, hasR=r>0;
  if(sal>0){
    const {r:ratio,why}=ratioInfo(sal,type,hasP,hasR);
    const ceil=sal*ratio, avail=ceil-p-r-visa; lastAvail=Math.max(avail,0);
    $('dedOut').innerHTML=`<div class="res">
      <div class="line"><span>النسبة (${why})</span><span>${Math.round(ratio*100)}٪</span></div>
      <div class="line"><span>سقف الاستقطاع</span><span>${fmt(ceil)}</span></div>
      <div class="line tot"><span>المتاح لقسط جديد</span><span>${fmt(Math.max(avail,0))}</span></div></div>`;
  } else { lastAvail=0; $('dedOut').innerHTML='<div class="hint" style="padding:4px 0">أدخل الراتب لعرض المتاح.</div>'; }

  // bank
  const price=CURCAR.price, bank=$('c_bank').value, isR=bank==='rajhi';
  const tr=$('c_tr').value, emp=$('c_emp').value, n=+$('c_mo').value, years=n/12;
  const age=+$('c_age').value||0, insRate=(+$('c_ins').value||4.5)/100;
  let margin,balloonPct,minDown,minSal;
  if(isR){ margin=0.06; balloonPct=tr==='yes'?0.50:0.35; minDown=0;
    minSal=(tr==='yes'?{approved:5000,nonapproved:7000,gov:3500}:{approved:7000,nonapproved:7000,gov:7000})[emp]; }
  else { margin=tr==='yes'?0.048:0.053; balloonPct=tr==='yes'?0.35:0.30; minDown=tr==='yes'?5:10; minSal=tr==='yes'?3500:4000; }
  if(isR && tr==='no' && emp==='nonapproved'){ $('bankOut').innerHTML='<div class="note warn">❌ غير محوّل وغير معتمد — مرفوض (الراجحي).</div>'; return; }
  let dp=Math.min(Math.max(+$('c_dp').value||0,0),100); if(dp<minDown){dp=minDown;$('c_dp').value=minDown;}
  const down=price*dp/100, finance=price-down, balloon=price*balloonPct;
  let base, monthlyIns;
  if(isR){ const rr=margin/12, an=(1-Math.pow(1+rr,-n))/rr; base=(finance-balloon*Math.pow(1+rr,-n))/an;
    monthlyIns=(price*insRate)*(1-Math.pow(0.85,years))/0.15/n; }
  else { base=(finance+finance*margin*years-balloon)/n; monthlyIns=price*insRate*years/n; }
  const inst=base+monthlyIns;
  const fit = lastAvail>0 ? (inst<=lastAvail) : null;
  let cmp='';
  if(fit===true) cmp=`<div class="note">🟢 القسط ${fmt(inst)} ضمن المتاح (${fmt(lastAvail)}).</div>`;
  else if(fit===false){
    // recommend down
    let recNote='';
    if(isR){ const rr=margin/12,v=Math.pow(1+rr,-n),an=(1-v)/rr; const md=price-balloon*v-(lastAvail-monthlyIns)*an;
      if(md<=price*(1-balloonPct)+1){const pct=Math.max(Math.ceil(md/price*100),minDown); recNote=`↧ ارفع الدفعة الأولى إلى ${pct}٪ (${fmt(price*pct/100)}) ليناسب.`;} }
    else { const md=price-(lastAvail*n-price*insRate*years+balloon)/(1+margin*years);
      if(md<=price*(1-balloonPct)+1){const pct=Math.max(Math.ceil(md/price*100),minDown); recNote=`↧ ارفع الدفعة الأولى إلى ${pct}٪ (${fmt(price*pct/100)}) ليناسب.`;} else recNote='يحتاج سيارة أرخص أو مدة أطول.'; }
    cmp=`<div class="note warn">🔴 القسط ${fmt(inst)} يتجاوز المتاح (${fmt(lastAvail)}). ${recNote}</div>`;
  }
  const warns=[];
  if(sal>0 && sal<minSal) warns.push(`الراتب ${fmt(sal)} أقل من الحد الأدنى ${fmt(minSal)}`);
  $('bankOut').innerHTML=`<div class="res">
    <div class="line"><span>هامش الربح</span><span>${(margin*100)}٪</span></div>
    <div class="line"><span>الدفعة الأولى (${dp}٪)</span><span>${fmt(down)}</span></div>
    <div class="line"><span>الدفعة الأخيرة (${Math.round(balloonPct*100)}٪)</span><span>${fmt(balloon)}</span></div>
    <div class="line"><span>التأمين الشهري (${insRate*100}٪)</span><span>${fmt(monthlyIns)}</span></div>
    <div class="line tot"><span>القسط الشهري شامل التأمين</span><span>${fmt(inst)} ريال</span></div></div>
    ${warns.length?`<div class="note warn">⚠️ ${warns.join('؛ ')}</div>`:''}${cmp}`;
}

// initial view: show a few available cars
LAST = CARS.filter(c=>c.status==='متاح').slice(0,9);
render(LAST,{tags:[]},CARS.length);
$('count').textContent = `${CARS.length} سيارة في المخزون — اكتب طلب العميل للبحث`;
</script>
</body>
</html>
