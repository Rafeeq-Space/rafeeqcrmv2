<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حاسبة تمويل السيارة — الاستقطاع وحسبة البنك</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --green:#006C35;--green-dark:#00522a;--green-light:#0a8c48;
    --gold:#C9A227;--gold-light:#e6c860;
    --ink:#0e1a14;--panel:#ffffff;--bg1:#04361f;--bg2:#0a1f16;
    --muted:#6b7d73;--line:#e3ece7;--danger:#b3261e;
    --radius:18px;--shadow:0 18px 50px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:
      radial-gradient(1200px 600px at 90% -10%, rgba(201,162,39,.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(10,140,72,.25), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    padding:22px 16px 60px;display:flex;flex-direction:column;align-items:center;
  }
  .wrap{width:100%;max-width:980px}

  /* Header */
  .brand{display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:18px}
  .brand .logo{width:52px;height:52px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));border-radius:14px;box-shadow:var(--shadow)}
  .brand h1{font-size:1.35rem;font-weight:800;letter-spacing:-.5px}
  .brand p{font-size:.85rem;opacity:.8;font-weight:500;margin-top:2px}
  .brand .flag-strip{margin-inline-start:auto;display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    padding:7px 13px;border-radius:999px;font-size:.8rem;font-weight:700}
  .brand .flag-strip svg{width:20px;height:20px}

  /* Stepper */
  .stepper{display:flex;align-items:center;gap:4px;margin-bottom:20px}
  .stp{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;cursor:pointer}
  .stp b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;
    background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);border:2px solid transparent;transition:.2s;font-size:.9rem}
  .stp span{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.55);white-space:nowrap}
  .stp.active b{background:var(--gold);color:#3a2d05;box-shadow:0 0 0 4px rgba(201,162,39,.25)}
  .stp.active span{color:#fff}
  .stp.done b{background:var(--green-light);color:#fff}
  .stp.done span{color:rgba(255,255,255,.85)}
  .stp:not(:last-child)::after{content:"";position:absolute;top:17px;inset-inline-end:-50%;
    width:100%;height:2px;background:rgba(255,255,255,.14);z-index:-0}
  @media(max-width:560px){.stp span{display:none}}

  /* Cards & scenes */
  .scene{display:none;animation:fade .35s ease}
  .scene.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card-head{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
    padding:18px 22px;display:flex;align-items:center;gap:12px;position:relative}
  .card-head::after{content:"";position:absolute;inset-inline-start:0;bottom:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--gold),transparent)}
  .card-head svg{width:26px;height:26px}
  .card-head h2{font-size:1.15rem;font-weight:800}
  .card-head .num{margin-inline-start:auto;font-size:.8rem;font-weight:700;opacity:.8}
  .card-body{padding:22px}
  .grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}

  /* Hero */
  .hero{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:40px 28px;text-align:center}
  .hero .car{width:96px;height:96px;margin:0 auto 18px;display:grid;place-items:center;border-radius:24px;
    background:linear-gradient(135deg,var(--green),var(--green-light))}
  .hero h2{font-size:1.8rem;font-weight:800;margin-bottom:10px}
  .hero p{color:var(--muted);font-weight:500;max-width:520px;margin:0 auto 26px;line-height:1.7}
  .hero .flow{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:28px}
  .hero .flow span{background:rgba(10,140,72,.08);border:1px solid rgba(10,140,72,.2);color:var(--green-dark);
    padding:7px 14px;border-radius:999px;font-size:.82rem;font-weight:700}

  /* Fields */
  .field{margin-bottom:18px}
  .field>label{display:block;font-weight:700;font-size:.95rem;margin-bottom:8px}
  .hint{color:var(--muted);font-size:.8rem;font-weight:500}
  input[type="number"],input[type="text"],select{width:100%;padding:13px 16px;font-family:inherit;font-size:1.02rem;
    font-weight:700;border:2px solid var(--line);border-radius:12px;background:#fbfdfc;transition:.15s;-moz-appearance:textfield}
  select{cursor:pointer;appearance:none}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.grid3{grid-template-columns:1fr}}
  .segline{display:inline-flex;gap:8px;flex-wrap:wrap}
  .segline label{cursor:pointer;padding:10px 16px;border-radius:10px;border:2px solid var(--line);
    background:#fbfdfc;font-weight:700;font-size:.88rem;transition:.15s;position:relative}
  .segline input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .segline label:has(input:checked){border-color:var(--green);background:rgba(10,140,72,.1);color:var(--green)}
  .bank-hero{display:flex;align-items:center;gap:6px;font-weight:800;color:#fff;
    background:rgba(255,255,255,.12);padding:4px 12px;border-radius:999px;font-size:.85rem}
  input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{outline:none;border-color:var(--green-light);background:#fff;box-shadow:0 0 0 4px rgba(10,140,72,.12)}
  .with-unit{position:relative}
  .with-unit .unit{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:.9rem;pointer-events:none}
  .with-unit input{padding-inline-start:52px}

  /* Yes/No toggle */
  .yn{display:inline-flex;gap:8px}
  .yn label{cursor:pointer;padding:9px 20px;border-radius:10px;border:2px solid var(--line);background:#fbfdfc;font-weight:700;font-size:.9rem;transition:.15s;position:relative}
  .yn input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .yn label.y:has(input:checked){border-color:var(--green);background:rgba(10,140,72,.1);color:var(--green)}
  .yn label.n:has(input:checked){border-color:var(--danger);background:rgba(179,38,30,.08);color:var(--danger)}
  .cond{display:none;margin-top:10px}
  .cond.show{display:block}

  /* Seg (employee type) */
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .seg label{position:relative;cursor:pointer;text-align:center;padding:14px 6px;border-radius:12px;
    border:2px solid var(--line);background:#fbfdfc;font-weight:700;font-size:.92rem;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:6px}
  .seg label svg{width:26px;height:26px;opacity:.7}
  .seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
  .seg label:hover{border-color:var(--green-light)}
  .seg input:checked+.seg-in{color:var(--green)}
  .seg label:has(input:checked){border-color:var(--green);background:rgba(10,140,72,.08);box-shadow:0 0 0 3px rgba(10,140,72,.1)}
  #noCommitField.dim .seg{opacity:.72}
  #noCommitField .dim-tag{display:none;margin-top:8px;font-size:.82rem;font-weight:700;color:var(--gold);
    background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.35);border-radius:8px;padding:8px 12px;line-height:1.6}
  #noCommitField.dim .dim-tag{display:block}

  /* Checklist / doc cards */
  .check-row{display:flex;flex-direction:column;gap:12px}
  .check{border:2px solid var(--line);border-radius:12px;padding:14px 16px;background:#fbfdfc;transition:.15s}
  .check.on{border-color:var(--green);background:rgba(10,140,72,.06)}
  .check .top{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700}
  .check .top input{width:20px;height:20px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
  .check .top .ico{margin-inline-start:auto;opacity:.55;flex:0 0 auto}
  .check .desc{margin-top:6px;color:var(--muted);font-size:.82rem;font-weight:500;padding-inline-start:32px;line-height:1.6}
  .check .sub{margin-top:12px;display:none}
  .check.on .sub{display:block}
  .tagline{display:inline-block;margin-inline-start:6px;font-size:.72rem;font-weight:800;color:#8a6d10;
    background:rgba(201,162,39,.15);border:1px solid rgba(201,162,39,.4);padding:2px 8px;border-radius:999px}

  /* Info note */
  .note{margin-top:16px;background:rgba(10,140,72,.07);border:1px solid rgba(10,140,72,.2);border-radius:12px;
    padding:13px 15px;font-size:.87rem;font-weight:600;color:var(--green-dark);display:flex;gap:8px;line-height:1.6}
  .note.warn{background:rgba(179,38,30,.06);border-color:rgba(179,38,30,.25);color:var(--danger)}
  .note.gold{background:rgba(201,162,39,.1);border-color:rgba(201,162,39,.35);color:#7a5f0e}

  /* Compare cards (محول / غير محول) */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:600px){.cmp{grid-template-columns:1fr}}
  .cmp .box{border:2px solid var(--line);border-radius:14px;padding:16px;background:#fbfdfc}
  .cmp .box h3{font-size:1rem;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .cmp .box.a{border-color:rgba(10,140,72,.4)}
  .cmp .box.a h3{color:var(--green)}
  .cmp .box.b h3{color:var(--muted)}
  .cmp .box ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .cmp .box li{font-size:.86rem;font-weight:600;color:#33443b;padding-inline-start:20px;position:relative;line-height:1.5}
  .cmp .box li::before{content:"•";position:absolute;inset-inline-start:0;color:var(--gold);font-weight:800}

  .cond-list{list-style:none;display:flex;flex-direction:column;gap:10px}
  .cond-list li{background:#fbfdfc;border:2px solid var(--line);border-radius:12px;padding:13px 15px;
    font-weight:600;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
  .cond-list li b{color:var(--green)}

  /* Result */
  .result .card-head{background:linear-gradient(135deg,#0e1a14,#1e2f26)}
  .gauge{display:flex;flex-direction:column;align-items:center;padding:6px 0 4px}
  .gauge svg{width:210px;height:130px}
  .gauge .val{font-size:2.1rem;font-weight:800;color:var(--green);margin-top:-6px}
  .gauge .val .cur{font-size:1rem;color:var(--muted);font-weight:700}
  .gauge .cap{color:var(--muted);font-weight:600;font-size:.85rem}
  .lines{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .line{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-weight:600}
  .line span:first-child{color:var(--muted)}
  .line span:last-child{font-weight:800}
  .line.sub span:first-child{padding-inline-start:14px;font-size:.9rem}
  .line.neg span:last-child{color:var(--danger)}
  .line.total{border-top:2px solid var(--ink);margin-top:8px;padding-top:14px;font-size:1.1rem}
  .badge{display:inline-block;background:rgba(201,162,39,.15);color:#8a6d10;border:1px solid rgba(201,162,39,.4);
    padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:800;margin-top:2px}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-weight:600}

  /* Nav buttons */
  .nav{display:flex;gap:12px;margin-top:22px;align-items:center}
  .btn{border:none;font-family:inherit;font-weight:800;font-size:1rem;padding:14px 26px;border-radius:12px;
    cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:linear-gradient(135deg,var(--green),var(--green-light));color:#fff;box-shadow:0 10px 24px rgba(10,140,72,.3)}
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
  .btn-ghost:hover{border-color:var(--green-light);color:var(--green)}
  .btn-link{background:none;border:none;color:rgba(255,255,255,.75);font-family:inherit;font-weight:700;
    cursor:pointer;text-decoration:underline;font-size:.9rem}
  .spacer{margin-inline-start:auto}

  footer{margin-top:24px;color:rgba(255,255,255,.6);font-size:.8rem;font-weight:500;text-align:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" width="32" height="32"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11m-14 0h14m-14 0a2 2 0 0 0-2 2v3h2m14-5a2 2 0 0 1 2 2v3h-2m-2 0H7m10 0v2m-10-2v2M6.5 14.5h.01M17.5 14.5h.01" stroke="#0e1a14" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>حاسبة تمويل السيارة</h1>
      <p>الاستقطاع وحسبة البنك</p>
    </div>
    <div class="flag-strip">
      <svg viewBox="0 0 24 16"><rect width="24" height="16" rx="2" fill="#006C35"/><rect x="4" y="10.5" width="16" height="1.6" rx=".8" fill="#fff"/><rect x="9" y="4" width="6" height="4" rx="1" fill="#fff"/></svg>
      السعودية
    </div>
  </div>

  <!-- Stepper -->
  <div class="stepper" id="stepper">
    <div class="stp" data-i="0"><b>١</b><span>الاستقطاع</span></div>
    <div class="stp" data-i="1"><b>٢</b><span>حسبة البنك</span></div>
  </div>

  <!-- ===== STEP 3: الحاسبة ===== -->
  <section class="scene active" id="s4">
    <div class="grid2">
      <div class="card">
        <div class="card-head">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2>حاسبة الاستقطاع</h2>
          <span class="num">١ / ٢</span>
        </div>
        <div class="card-body">
          <div class="field">
            <label for="salary">الراتب الشهري <span class="hint">(بدون حد أقصى — المبلغ الصافي بالريال)</span></label>
            <div class="with-unit"><span class="unit">ريال</span>
              <input type="number" id="salary" min="0" step="100" placeholder="مثال: 11200" inputmode="numeric" /></div>
          </div>

          <div class="field" id="noCommitField">
            <label>من غير التزامات <span class="hint">— تُطبَّق نسبتها فقط إذا ما كان على العميل أي التزام</span></label>
            <div class="seg" id="type">
              <label><input type="radio" name="etype" value="bank" checked />
                <span class="seg-in"><svg viewBox="0 0 24 24" fill="none"><path d="M3 21h18M4 10h16M5 10l7-6 7 6M6 10v11M18 10v11M10 10v11M14 10v11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>بنك <small class="hint">٣٣٪</small></span></label>
              <label><input type="radio" name="etype" value="company" />
                <span class="seg-in"><svg viewBox="0 0 24 24" fill="none"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 21V9h4a1 1 0 0 1 1 1v11M4 21h17M7 8h1M11 8h1M7 12h1M11 12h1M7 16h1M11 16h1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>شركة <small class="hint">٤٥٪</small></span></label>
              <label><input type="radio" name="etype" value="retiree" />
                <span class="seg-in"><svg viewBox="0 0 24 24" fill="none"><path d="M12 7a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM6 22l1.5-7M18 22l-1.5-7M8 15h8l-.7-4.2A3 3 0 0 0 12.4 8h-.8a3 3 0 0 0-2.9 2.8L8 15Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>متقاعد <small class="hint">٢٥٪</small></span></label>
            </div>
            <div class="dim-tag" id="commitNote"></div>
          </div>

          <div class="field">
            <label>الالتزامات الحالية</label>
            <div class="check-row">
              <div class="check" id="c-personal">
                <label class="top"><input type="checkbox" id="hasPersonal" /> التزام شخصي (قرض شخصي)
                  <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 8V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.6"/></svg></span></label>
                <div class="sub with-unit"><span class="unit">ريال</span><input type="number" id="personalInst" min="0" step="50" placeholder="القسط الشهري" inputmode="numeric" /></div>
              </div>
              <div class="check" id="c-realestate">
                <label class="top"><input type="checkbox" id="hasRealEstate" /> التزام عقاري (تمويل عقاري)
                  <span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7M5 10v10h14V10M9 20v-6h6v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></label>
                <div class="sub with-unit"><span class="unit">ريال</span><input type="number" id="realEstateInst" min="0" step="50" placeholder="القسط الشهري" inputmode="numeric" /></div>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="visaLimit">حد بطاقة الفيزا / الائتمان <span class="hint">(اختياري، بدون حد أقصى — تُحسب ٥٪ من الحد)</span></label>
            <div class="with-unit"><span class="unit">ريال</span>
              <input type="number" id="visaLimit" min="0" step="500" placeholder="مثال: 20000" inputmode="numeric" /></div>
          </div>

          <div class="nav">
            <button class="btn btn-primary spacer" onclick="next()">التالي: حسبة البنك ←</button>
          </div>
        </div>
      </div>

      <div class="card result">
        <div class="card-head">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 20a8 8 0 1 0-8-8M12 12l4-3M4 12H2M12 4V2M20 12h2" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2>النتيجة</h2>
        </div>
        <div class="card-body" id="out">
          <div class="empty">أدخل الراتب لعرض قدرة العميل التمويلية.</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== STEP 5: حسبة البنك (الراجحي) ===== -->
  <section class="scene" id="s5">
    <div class="grid2">
      <div class="card">
        <div class="card-head">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 21h18M4 10h16M5 10l7-6 7 6M6 10v11M18 10v11M10 10v11M14 10v11" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2 id="bankTitle">حسبة البنك — الراجحي</h2>
          <span class="num">٢ / ٢</span>
        </div>
        <div class="card-body">
          <div class="field">
            <label>البنك</label>
            <div class="segline" id="bank">
              <label><input type="radio" name="bank" value="rajhi" checked> الراجحي</label>
              <label><input type="radio" name="bank" value="ahli"> الأهلي</label>
              <label><input type="radio" name="bank" value="albilad"> البلاد</label>
              <label><input type="radio" name="bank" value="anb"> العربي الوطني</label>
              <label><input type="radio" name="bank" value="emirates"> الإمارات</label>
              <label><input type="radio" name="bank" value="riyad"> الرياض</label>
              <label><input type="radio" name="bank" value="sab"> ساب</label>
              <label><input type="radio" name="bank" value="saib"> الاستثمار</label>
              <label><input type="radio" name="bank" value="alawwal"> الأول</label>
            </div>
          </div>

          <div class="field">
            <label>نوع العميل</label>
            <div class="segline" id="transfer">
              <label><input type="radio" name="transfer" value="yes" checked> عميل محوّل</label>
              <label><input type="radio" name="transfer" value="no"> عميل غير محوّل</label>
            </div>
          </div>

          <div class="field">
            <label>جهة العمل</label>
            <div class="segline" id="employer">
              <label><input type="radio" name="employer" value="approved" checked> معتمد</label>
              <label><input type="radio" name="employer" value="nonapproved"> غير معتمد</label>
              <label id="govOpt"><input type="radio" name="employer" value="gov"> حكومي</label>
            </div>
          </div>

          <div class="grid3">
            <div class="field">
              <label for="bankSalary">صافي الراتب <span class="hint">(بدون حد أقصى)</span></label>
              <div class="with-unit"><span class="unit">ريال</span>
                <input type="number" id="bankSalary" min="0" step="100" placeholder="مثال: 11200" inputmode="numeric" /></div>
            </div>
            <div class="field">
              <label for="bankAge">العمر <span class="hint">(١٨ سنة فأعلى — يحدّد التأمين تلقائياً)</span></label>
              <input type="number" id="bankAge" min="18" placeholder="مثال: 34" inputmode="numeric" />
            </div>
          </div>

          <div class="field">
            <label for="insInput">تأمين السنة الأولى <span class="hint">(ريال — أي مبلغ؛ افتراضي ٥٪ من السعر لكل الأعمار، اكتب رقم عرض التأمين الحقيقي لو متوفر)</span></label>
            <div class="with-unit"><span class="unit">ريال</span>
              <input type="number" id="insInput" step="50" min="0" placeholder="مثال: 5000" inputmode="numeric" /></div>
            <div class="hint" id="insEquivNote" style="margin-top:6px"></div>
          </div>

          <div class="field" id="emp1yrField">
            <label>مدة العمل <span class="hint" id="empHint">(تحدّد الدفعة الأخيرة للمحوّل)</span></label>
            <div class="segline" id="emp1yr">
              <label><input type="radio" name="emp1yr" value="yes" checked> <span id="empYes">أكثر من سنة</span></label>
              <label><input type="radio" name="emp1yr" value="no"> <span id="empNo">أقل من سنة</span></label>
            </div>
          </div>

          <div class="field">
            <label for="balloonSel">الدفعة الأخيرة % <span class="hint">(النطاق المعتاد ٢٠٪–٦٠٪ — قيمة مبدئية حسب البنك، اختَر أو اكتب أي نسبة)</span></label>
            <input type="number" id="balloonSel" list="balloonSelList" step="0.5" min="0" max="100" inputmode="decimal" />
            <datalist id="balloonSelList"></datalist>
          </div>

          <div class="field">
            <label for="carPrice">سعر السيارة <span class="hint">(بدون حد أقصى — شامل الضريبة)</span></label>
            <div class="with-unit"><span class="unit">ريال</span>
              <input type="number" id="carPrice" min="0" step="1000" placeholder="مثال: 75000" inputmode="numeric" /></div>
          </div>

          <div class="grid3">
            <div class="field">
              <label for="bankMonths">مدة التمويل <span class="hint">(١٢–٦٠ شهر)</span></label>
              <select id="bankMonths">
                <option value="12">١٢ شهر</option>
                <option value="24">٢٤ شهر</option>
                <option value="36">٣٦ شهر</option>
                <option value="48">٤٨ شهر</option>
                <option value="60" selected>٦٠ شهر</option>
              </select>
            </div>
            <div class="field">
              <label for="marginSel">هامش الربح % <span class="hint">(النطاق المعتاد ٢٪–١٢٪ — قيمة مبدئية حسب البنك، اختَر أو اكتب أي نسبة)</span></label>
              <input type="number" id="marginSel" list="marginSelList" step="0.5" min="0" inputmode="decimal" />
              <datalist id="marginSelList"></datalist>
            </div>
          </div>

          <div class="field" id="downField">
            <label for="bankDown">الدفعة الأولى % <span class="hint">(بدون حد أدنى ملزم ولا سقف — يمكن أن تكون أقل من افتراضي البنك)</span></label>
            <div class="with-unit"><span class="unit">٪</span>
              <input type="number" id="bankDown" min="0" max="100" step="1" value="0" inputmode="numeric" /></div>
            <div class="hint" id="downDefaultNote" style="margin-top:6px"></div>
            <button type="button" class="btn btn-ghost" id="applyDown" style="margin-top:10px;padding:9px 16px;font-size:.85rem;display:none">↧ طبّق الدفعة المطلوبة تلقائياً</button>
          </div>

          <div class="nav"><button class="btn btn-ghost" onclick="prev()">→ رجوع للاستقطاع</button></div>
        </div>
      </div>

      <div class="card result">
        <div class="card-head" style="background:linear-gradient(135deg,#0e1a14,#1e2f26)">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2>نتيجة البنك</h2>
        </div>
        <div class="card-body" id="bankOut">
          <div class="empty">أدخل سعر السيارة لعرض القسط الشهري.</div>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('en-US');


  /* ===== Journey navigation (٢ خطوة: الاستقطاع ثم حسبة البنك) ===== */
  const scenes = ['s4','s5'];
  let idx = 0;
  let lastAvailable = 0;
  function show(i){
    idx = Math.max(0, Math.min(scenes.length-1, i));
    scenes.forEach((s,k)=>$(s).classList.toggle('active', k===idx));
    document.querySelectorAll('.stp').forEach(st=>{
      const step = +st.dataset.i;
      st.classList.toggle('active', step === idx);
      st.classList.toggle('done', step < idx);
    });
    if(scenes[idx]==='s5'){ prefillBank(); bankCalc(); }
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function next(){ show(idx+1); }
  function prev(){ show(idx-1); }
  document.querySelectorAll('.stp').forEach(st=> st.addEventListener('click', ()=> show(+st.dataset.i)));

  function prefillBank(){
    const s = +$('salary').value || 0;
    if(s > 0 && !$('bankSalary').value) $('bankSalary').value = s;
  }

  /* ===== Deduction logic ===== */
  function ratioInfo(salary, type, hasP, hasR){
    // الراتب أكبر من ٢٥,٠٠٠ → نسبة ثابتة ٧٠٪ في كل الحالات (تغلب كل القواعد)
    if(salary > 25000)
      return {r:0.70, why:'الراتب أكبر من ٢٥,٠٠٠ — نسبة ثابتة ٧٠٪ لكل الحالات', tag:'٧٠٪ راتب مرتفع'};
    // القاعدة الذهبية: العقاري يغلب — للجميع بما فيهم المتقاعد (حتى لو معه شخصي)
    if(hasR){
      return salary < 15000
        ? {r:0.55, why:'التزام عقاري — الراتب أقل من ١٥,٠٠٠', tag:'عقاري ٥٥٪'}
        : {r:0.65, why:'التزام عقاري — الراتب ١٥,٠٠٠ فأعلى', tag:'عقاري ٦٥٪'};
    }
    // استثناء المتقاعد: مع التزام شخصي فقط (بدون عقاري) → ٤٥٪
    if(type === 'retiree' && hasP)
      return {r:0.45, why:'متقاعد مع التزام شخصي — ٤٥٪', tag:'متقاعد ٤٥٪'};
    if(hasP) return {r:0.45, why:'التزام شخصي (تنطبق على الكل)', tag:'شخصي ٤٥٪'};
    const base = {bank:{r:0.33,l:'بنك'}, company:{r:0.45,l:'شركة'}, retiree:{r:0.25,l:'متقاعد'}}[type];
    return {r:base.r, why:`بدون التزامات — ${base.l}`, tag:`${Math.round(base.r*100)}٪`};
  }

  function gauge(pct){
    const p = Math.min(Math.max(pct,0),1);
    const a = Math.PI * (1 - p);
    const x = 105 + 90*Math.cos(a), y = 115 - 90*Math.sin(a);
    return `<svg viewBox="0 0 210 130">
      <path d="M15 115 A90 90 0 0 1 195 115" fill="none" stroke="#e3ece7" stroke-width="14" stroke-linecap="round"/>
      <path d="M15 115 A90 90 0 0 1 195 115" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${Math.PI*90}" stroke-dashoffset="${Math.PI*90*(1-p)}"/>
      <circle cx="${x}" cy="${y}" r="8" fill="#006C35"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0a8c48"/><stop offset="1" stop-color="#C9A227"/></linearGradient></defs>
    </svg>`;
  }

  function calc(){
    const salary = +$('salary').value || 0;
    const type = document.querySelector('input[name="etype"]:checked').value;
    const hasP = $('hasPersonal').checked;
    const hasR = $('hasRealEstate').checked;
    const pInst = hasP ? (+$('personalInst').value || 0) : 0;
    const rInst = hasR ? (+$('realEstateInst').value || 0) : 0;
    const visaLimit = +$('visaLimit').value || 0;
    const visa = visaLimit * 0.05;
    const hasVisa = visaLimit > 0;      // الفيزا تُعتبر التزام شخصي
    const hasPeff = hasP || hasVisa;    // التزام شخصي فعلي (قرض شخصي أو فيزا)

    $('c-personal').classList.toggle('on', hasP);
    $('c-realestate').classList.toggle('on', hasR);
    const hasCommit = hasPeff || hasR;
    $('noCommitField').classList.toggle('dim', hasCommit);
    if(hasCommit){
      $('commitNote').innerHTML = hasR
        ? '🔒 يوجد التزام عقاري ← تُطبّق نسبة <b>العقاري (٥٥–٦٥٪)</b> — القاعدة الذهبية: العقاري يغلب (حتى للمتقاعد ومع وجود شخصي).'
        : (type === 'retiree'
          ? '🔒 متقاعد مع التزام شخصي/فيزا ← طُبّقت نسبة <b>٤٥٪</b>.'
          : '🔒 التزام شخصي/فيزا ← النسبة <b>٤٥٪</b>، وفئة البنك/الشركة لا تؤثّر.');
    }

    const out = $('out');
    if(salary <= 0){ out.innerHTML = '<div class="empty">أدخل الراتب لعرض قدرة العميل التمويلية.</div>'; return; }

    const {r, why, tag} = ratioInfo(salary, type, hasPeff, hasR);
    const ceiling = salary * r;
    const commitments = pInst + rInst + visa;
    const available = ceiling - commitments;
    const bothNote = (hasPeff && hasR)
      ? '<div class="note">⚖️ العميل عنده التزام عقاري وشخصي معاً — طُبّقت نسبة <b>العقاري</b> حسب القاعدة.</div>' : '';

    let rows = '';
    if(pInst) rows += `<div class="line sub"><span>قسط شخصي</span><span>−${fmt(pInst)}</span></div>`;
    if(rInst) rows += `<div class="line sub"><span>قسط عقاري</span><span>−${fmt(rInst)}</span></div>`;
    if(visa)  rows += `<div class="line sub"><span>فيزا (٥٪ × ${fmt(visaLimit)})</span><span>−${fmt(visa)}</span></div>`;
    if(!commitments) rows = '<div class="line sub"><span>لا يوجد التزامات قائمة</span><span>−0</span></div>';

    const warn = available <= 0
      ? '<div class="note warn">⚠️ لا توجد قدرة متاحة — الالتزامات تساوي أو تتجاوز سقف الاستقطاع.</div>' : '';

    out.innerHTML = `
      <div class="gauge">
        ${gauge(ceiling ? Math.max(available,0)/ceiling : 0)}
        <div class="val">${fmt(Math.max(available,0))} <span class="cur">ريال</span></div>
        <div class="cap">المتاح لقسط تمويل جديد</div>
      </div>
      <div class="lines">
        <div class="line"><span>النسبة المطبّقة</span><span>${Math.round(r*100)}٪ <span class="badge">${tag}</span></span></div>
        <div style="margin:-4px 0 8px"><span class="hint">${why}</span></div>
        <div class="line"><span>سقف الاستقطاع (الراتب × النسبة)</span><span>${fmt(ceiling)}</span></div>
        ${rows}
        <div class="line total ${available<=0?'neg':''}"><span>المتاح للتمويل الجديد</span><span>${fmt(available)}</span></div>
      </div>
      ${bothNote}${warn}`;
    lastAvailable = Math.max(available, 0);
  }

  /* ===== Al Rajhi bank calculation ===== */
  function rejectHTML(msg){ return `<div class="note warn" style="margin-top:0">❌ ${msg}</div>`; }

  function bankCalc(){
    const out = $('bankOut');
    const bank = document.querySelector('input[name="bank"]:checked').value;
    const isRajhi = bank === 'rajhi';
    const isAhli  = bank === 'ahli';
    const isNonFin = ['sab','saib','alawwal'].includes(bank);             // لا تموّل سيارات
    const BANKLABEL = {rajhi:'الراجحي',ahli:'الأهلي',albilad:'البلاد',anb:'العربي الوطني',
      emirates:'الإمارات',riyad:'الرياض',sab:'ساب',saib:'الاستثمار',alawwal:'الأول'}[bank];
    const price    = +$('carPrice').value || 0;
    const salary   = +$('bankSalary').value || 0;
    const age      = +$('bankAge').value || 0;
    const transfer = document.querySelector('input[name="transfer"]:checked').value; // yes / no
    const employer = document.querySelector('input[name="employer"]:checked').value; // approved / nonapproved / gov
    const empMet   = document.querySelector('input[name="emp1yr"]:checked').value === 'yes';
    const months   = +$('bankMonths').value;

    // ===== تكييف الواجهة حسب البنك =====
    $('bankTitle').textContent = 'حسبة البنك — ' + BANKLABEL;
    $('employer').closest('.field').style.display = (isRajhi || isAhli) ? '' : 'none'; // جهة العمل للراجحي/الأهلي فقط
    $('emp1yrField').style.display = isNonFin ? 'none' : '';
    if(isRajhi){
      $('empHint').textContent = '(تحدّد الدفعة الأخيرة للمحوّل)';
      $('empYes').textContent = 'أكثر من سنة'; $('empNo').textContent = 'أقل من سنة';
      $('emp1yrField').style.opacity = transfer === 'yes' ? '1' : '.5';
    } else {
      $('empHint').textContent = '(شرط ٣ شهور)';
      $('empYes').textContent = '٣ شهور فأكثر'; $('empNo').textContent = 'أقل من ٣ شهور';
      $('emp1yrField').style.opacity = '1';
    }
    // ===== بنوك لا تقدّم تمويل سيارات =====
    if(isNonFin){
      out.innerHTML = `<div class="note warn" style="margin-top:0">🚫 بنك ${BANKLABEL} لا يقدّم تمويل سيارات.</div>`;
      return;
    }

    // ===== الهامش والدفعة الأخيرة: من القوائم مباشرة (قيمة مبدئية حسب البنك، قابلة للتغيير) =====
    const margin = (+$('marginSel').value || 6) / 100;
    const balloonPct = (+$('balloonSel').value || 35) / 100;
    let minDownPct, minSalary;
    if(isRajhi){
      minDownPct = 0;
      minSalary = (transfer === 'yes' ? {approved:5000, nonapproved:7000, gov:3500}
                                      : {approved:7000, nonapproved:7000, gov:7000})[employer];
    } else if(isAhli){
      minDownPct = transfer === 'yes' ? 0.05 : 0.10;
      minSalary = transfer === 'yes' ? 3500 : 4000;
    } else if(bank === 'riyad'){
      minDownPct = 0.50;
      minSalary = transfer === 'yes' ? 5000 : 7000;
    } else { // البلاد/العربي الوطني/الإمارات
      minDownPct = 0;
      minSalary = transfer === 'yes' ? 3500 : 5000;
    }

    // الرفض (الراجحي فقط): غير محوّل + غير معتمد
    if(isRajhi && transfer === 'no' && employer === 'nonapproved'){
      out.innerHTML = rejectHTML('عميل غير محوّل وغير معتمد — التمويل مرفوض حسب سياسة الراجحي.');
      return;
    }
    if(price <= 0){ out.innerHTML = '<div class="empty">أدخل سعر السيارة لعرض القسط الشهري.</div>'; return; }

    // الدفعة الأولى: بدون حد أدنى ملزم — المندوب حر يزيدها أو ينزّلها تحت افتراضي البنك
    const downPct = Math.min(Math.max(+$('bankDown').value || 0, 0), 100) / 100;

    const balloon = price * balloonPct;
    const down = price * downPct;
    const finance = price - down;
    const n = months, years = n / 12;
    const year1Ins = +$('insInput').value || 0; // تأمين السنة الأولى بالريال — يُحدَّث تلقائياً عند تغيير السعر/البنك/العمر
    if(year1Ins > 0 && price > 0){
      const equivPct = (year1Ins/price*100).toFixed(1);
      $('insEquivNote').textContent = isRajhi
        ? `التأمين الحالي ${fmt(year1Ins)} ريال ≈ ${equivPct}٪ من سعر السيارة. الافتراضي ثابت ٥٪ لكل الأعمار (النطاق المعتاد ٤.٥٪–٦.٥٪ للرجوع إليه إذا احتجت) — غيّر الرقم يدوياً كما تريد.`
        : `التأمين الحالي ${fmt(year1Ins)} ريال ≈ ${equivPct}٪ من سعر السيارة — غيّر الرقم لو عندك نسبة محددة تريدها.`;
    } else {
      $('insEquivNote').textContent = '';
    }

    let baseInst, totalIns, monthlyIns, admin, totalProfit;
    if(isRajhi){
      // الراجحي: رصيد متناقص + تأمين يتناقص ١٥٪ سنوياً (نفس طريقة الإكسل) + إداري ١٪+ضريبة
      const r = margin / 12;
      const annuity = (1 - Math.pow(1+r, -n)) / r;
      baseInst = (finance - balloon * Math.pow(1+r, -n)) / annuity;
      totalIns = year1Ins * (1 - Math.pow(0.85, years)) / 0.15;
      monthlyIns = totalIns / n;
      admin = Math.min(finance * 0.01 * 1.15, 5000);
      totalProfit = baseInst * n - (finance - balloon); // إجمالي الربح المتضمن في الأقساط
    } else {
      // الأهلي/باقي البنوك: نسبة ثابتة (Flat) + قسمة بسيطة + إداري ١٪ بدون ضريبة + تأمين سنوي ثابت (بدون تناقص)
      totalProfit = finance * margin * years;         // ربح ثابت
      totalIns = year1Ins * years;                    // تأمين ثابت كل سنة
      monthlyIns = totalIns / n;
      baseInst = (finance + totalProfit - balloon) / n;
      admin = finance * 0.01;
    }
    const instIncl = baseInst + monthlyIns;
    const upfront = down + totalIns + admin; // عرض فقط: يشمل التأمين ورسوم الإدارة
    const ratioSalary = salary > 0 ? instIncl / salary : 0;
    const empLabel = {approved:'معتمد', nonapproved:'غير معتمد', gov:'حكومي'}[employer];
    const tLabel = transfer === 'yes' ? 'محوّل' : 'غير محوّل';
    const catLabel = (isRajhi || isAhli) ? `${empLabel} / ${tLabel}` : tLabel;

    // ===== ملاحظات الأهلية =====
    const warns = [];
    if(salary > 0 && salary < minSalary) warns.push(`صافي الراتب ${fmt(salary)} أقل من الحد الأدنى ${fmt(minSalary)}`);
    if(age > 0 && age < 18) warns.push('العمر أقل من ١٨ سنة');
    if(!isRajhi && !empMet && !(isAhli && employer === 'gov')) warns.push('مدة العمل أقل من ٣ شهور');
    const elig = warns.length
      ? `<div class="note warn">⚠️ تنبيهات (${catLabel}): ${warns.join('؛ ')} — قد يُرفض.</div>`
      : `<div class="note">✅ مؤهّل مبدئياً (${catLabel}) — صافي الراتب ${fmt(salary)} ≥ ${fmt(minSalary)}.</div>`;

    let cmp = '';
    if(lastAvailable > 0){
      cmp = instIncl <= lastAvailable
        ? `<div class="note">🟢 القسط ${fmt(instIncl)} ضمن المتاح من الاستقطاع (${fmt(lastAvailable)}).</div>`
        : `<div class="note warn">🔴 القسط ${fmt(instIncl)} يتجاوز المتاح من الاستقطاع (${fmt(lastAvailable)}).</div>`;
    }

    // رفع الدفعة الأولى (فوق الحد الأدنى للبنك) حتى يناسب القسط الاستقطاع
    let recNote = '', recDownPct = null;
    if(lastAvailable > 0 && instIncl > lastAvailable){
      let minDownAmt;
      if(isRajhi){
        const r = margin / 12;
        const annuity = (1 - Math.pow(1+r, -n)) / r;
        minDownAmt = price - balloon*Math.pow(1+r,-n) - (lastAvailable - monthlyIns)*annuity;
      } else {
        // Flat: القسط = ((price−down)(1+margin×years) + totalIns − balloon) / n
        minDownAmt = price - (lastAvailable*n - totalIns + balloon) / (1 + margin*years);
      }
      const maxSensibleDown = price * (1 - balloonPct); // مبلغ التمويل لا يقل عن الدفعة الأخيرة
      if(minDownAmt <= maxSensibleDown + 1){
        recDownPct = Math.max(Math.ceil(minDownAmt / price * 100), Math.round(minDownPct * 100));
        const recAmt = price * recDownPct / 100;
        recNote = `<div class="note gold">↧ ارفع الدفعة الأولى إلى <b>${fmt(recAmt)} ريال (${recDownPct}٪)</b> عشان يناسب الاستقطاع.</div>`;
      } else {
        recNote = `<div class="note warn">🔴 حتى بأقصى دفعة أولى منطقية القسط يتجاوز الاستقطاع — يحتاج سيارة أرخص أو مدة أطول.</div>`;
      }
    }
    const applyBtn = $('applyDown');
    if(recDownPct !== null && recDownPct > Math.round(downPct * 100)){
      applyBtn.style.display = 'inline-flex'; applyBtn.dataset.pct = recDownPct;
    } else { applyBtn.style.display = 'none'; }

    out.innerHTML = `
      <div class="gauge">
        <div class="val">${fmt(instIncl)} <span class="cur">ريال/شهر</span></div>
        <div class="cap">القسط الشهري شامل التأمين — ${BANKLABEL}</div>
      </div>
      <div class="lines">
        <div class="line"><span>نسبة القسط من الراتب</span><span>${salary>0?Math.round(ratioSalary*100)+'٪':'—'}</span></div>
        <div class="line"><span>هامش الربح</span><span>${(margin*100)}٪</span></div>
        <div class="line"><span>الدفعة الأولى (${Math.round(downPct*100)}٪)</span><span>${fmt(down)}</span></div>
        <div class="line"><span>مبلغ التمويل</span><span>${fmt(finance)}</span></div>
        <div class="line"><span>الدفعة الأخيرة (${Math.round(balloonPct*100)}٪)</span><span>${fmt(balloon)}</span></div>
        <div class="line sub"><span>القسط الأساسي</span><span>${fmt(baseInst)}</span></div>
        <div class="line sub"><span>تأمين السنة الأولى</span><span>${fmt(year1Ins)}</span></div>
        <div class="line sub"><span>التأمين الشهري</span><span>${fmt(monthlyIns)}</span></div>
        <div class="line total"><span>القسط شامل التأمين</span><span>${fmt(instIncl)}</span></div>
        <div class="line sub"><span>رسوم إدارية (مرة واحدة)</span><span>${fmt(admin)}</span></div>
        <div class="line"><span>المدفوع مقدماً (دفعة + تأمين + رسوم)</span><span>${fmt(upfront)}</span></div>
      </div>
      ${elig}${recNote}${cmp}`;
  }

  ['salary','visaLimit','personalInst','realEstateInst'].forEach(id => $(id).addEventListener('input', calc));
  $('type').addEventListener('change', calc);
  ['hasPersonal','hasRealEstate'].forEach(id => $(id).addEventListener('change', calc));
  // نسبة تقديرية لاقتراح مبلغ تأمين السنة الأولى فقط (تحوّل لريال بضربها في سعر السيارة) — الأهلي ٥٪ ثابتة دايماً، الراجحي ٥٪ افتراضي قبل إدخال العمر ثم يتغيّر حسب العمر (٦.٥٪/٤.٥٪)، وباقي البنوك حسب العمر فقط
  function defaultInsuranceRatePct(bank){
    if(bank === 'ahli') return 5;
    const age = +$('bankAge').value || 0;
    if(age > 0) return age <= 25 ? 6.5 : 4.5;
    return bank === 'rajhi' ? 5 : null;
  }
  let downManuallySet = false; // يمنع الكتابة فوق دفعة أولى غيّرها المندوب يدوياً
  function applyDefaultInsuranceAmount(){
    // يُحسب تلقائياً من سعر السيارة في كل مرة (بدون قفل) — التعديل اليدوي يبقى فقط للحسبة الحالية
    const bank = document.querySelector('input[name="bank"]:checked').value;
    const price = +$('carPrice').value || 0;
    const ratePct = defaultInsuranceRatePct(bank);
    if(ratePct === null || price <= 0) return;
    $('insInput').value = Math.round(price * ratePct / 100);
  }
  // هامش الربح ٢–١٢٪ والدفعة الأخيرة ٢٠–٦٠٪: قوائم اقتراحات (datalist) بفرق ٠.٥ — والحقل حر لأي رقم يكتبه المندوب
  function populateMarginBalloonOptions(){
    const mList = $('marginSelList'), bList = $('balloonSelList');
    for(let i=4;i<=24;i++){ const v=i/2; const o=document.createElement('option'); o.value=v; o.textContent=v+'٪'; mList.appendChild(o); }
    for(let i=40;i<=120;i++){ const v=i/2; const o=document.createElement('option'); o.value=v; o.textContent=v+'٪'; bList.appendChild(o); }
  }
  let lastBank = null;
  function syncMarginBalloonDefaults(){
    const bank = document.querySelector('input[name="bank"]:checked').value;
    if(bank !== lastBank){ downManuallySet = false; lastBank = bank; } // بنك جديد = دفعة أولى جديدة (والتأمين يُحسب تلقائياً دايماً)
    const transfer = document.querySelector('input[name="transfer"]:checked').value;
    const empMet = document.querySelector('input[name="emp1yr"]:checked').value === 'yes';
    let m, b, dp;
    if(bank === 'rajhi'){ m = 6; b = transfer === 'yes' ? (empMet ? 50 : 35) : 35; dp = 0; }
    else if(bank === 'ahli'){ m = transfer === 'yes' ? 4.5 : 5.7; b = transfer === 'yes' ? 35 : 30; dp = transfer === 'yes' ? 5 : 10; }
    else if(bank === 'riyad'){ m = transfer === 'yes' ? 4.5 : 5.2; b = 50; dp = 50; }
    else { m = transfer === 'yes' ? 4.5 : 5.2; b = 40; dp = 0; } // البلاد/العربي الوطني/الإمارات
    $('marginSel').value = m; $('balloonSel').value = b;
    if(!downManuallySet) $('bankDown').value = dp;
    $('downDefaultNote').textContent = `الافتراضي لهذا البنك: ${dp}٪ — يمكنك تغييره لأي نسبة حتى لو أقل.`;
    applyDefaultInsuranceAmount();
    bankCalc();
  }
  $('bankSalary').addEventListener('input', bankCalc);
  ['carPrice','bankAge'].forEach(id => $(id).addEventListener('input', () => { applyDefaultInsuranceAmount(); bankCalc(); }));
  $('bankDown').addEventListener('input', () => { downManuallySet = true; bankCalc(); });
  ['bank','transfer','emp1yr'].forEach(id => $(id).addEventListener('change', syncMarginBalloonDefaults));
  $('employer').addEventListener('change', bankCalc);
  $('insInput').addEventListener('input', bankCalc);
  ['marginSel','balloonSel'].forEach(id => $(id).addEventListener('input', bankCalc));
  $('bankMonths').addEventListener('change', bankCalc);
  $('applyDown').addEventListener('click', () => { $('bankDown').value = $('applyDown').dataset.pct; downManuallySet = true; bankCalc(); });
  populateMarginBalloonOptions();
  syncMarginBalloonDefaults();
  show(0);
  calc();
</script>
</body>
</html>
